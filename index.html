<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>StockFlow</title>
<script>
(function () {
  var BASE_MAIN = 'https://cdn.jsdelivr.net/gh/benz1sa2smanagement-hue/StockFlow-v2@4f4068ccb6baca2237fe695dac66e2e551b4f661/';
  var BASE_IMG  = 'https://cdn.jsdelivr.net/gh/benz1sa2smanagement-hue/StockFlow-v2@90dc8b4ad11af1ad32a735aa4378f6085fb3036d/';
  var BASE_OLD  = 'https://cdn.jsdelivr.net/gh/benz1sa2smanagement-hue/StockFlow-v2@ae32375574d529d1c5849ce620e08b3e6dc014e9/';
  var PIN  = 'https://cdn.jsdelivr.net/gh/benz1sa2smanagement-hue/StockFlow-v2@d9733c4f131159c79ebbb5762d63460cacd9711c/index.html';

  var EXTRA = [
    { f: 'product-image.js', base: BASE_IMG },
    { f: 'product-add.js', base: BASE_MAIN },
    { f: 'product-thumbs.js', base: BASE_OLD },
    { f: 'pack-wrong-guide.js', base: BASE_OLD },
    { f: 'pack-orders.js', base: BASE_OLD },
    { f: 'pack-line-ui.js', base: BASE_OLD },
    { f: 'pack-match.js', base: BASE_OLD },
    { f: 'pack-sku-expand.js', base: BASE_OLD },
    { f: 'pack-queue.js', base: BASE_OLD },
    { f: 'pack-queue-ui.js', base: BASE_OLD },
    { f: 'pack-bigseller-bridge.js', base: BASE_OLD },
    { f: 'pack-visual.js', base: BASE_MAIN }
  ];

  function loadScript(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(true); };
      s.onerror = function () { console.warn('[SF] fail', src); resolve(false); };
      document.head.appendChild(s);
    });
  }

  fetch(PIN, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
    document.open();
    document.write(html);
    document.close();

    setTimeout(function () {
      var chain = Promise.resolve();
      EXTRA.forEach(function (item) {
        chain = chain.then(function () { return loadScript(item.base + item.f); });
      });
      chain.then(function () {
        console.log('[SF] modules v7 edit-image hard-fix');
        setInterval(function () {
          document.querySelectorAll('input[type="file"][capture]').forEach(function (el) {
            el.removeAttribute('capture');
          });
        }, 800);
        setTimeout(function () {
          if (typeof window.__sfEnsureAddProduct === 'function') window.__sfEnsureAddProduct();
          if (typeof window.__sfRefreshThumbs === 'function') window.__sfRefreshThumbs();
        }, 600);
      });
    }, 100);
  }).catch(function (e) {
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">โหลดไม่สำเร็จ: ' + e + '</p>';
  });
})();
</script>
</head>
<body>
<p style="padding:24px;font-family:Sarabun,sans-serif;color:#666">กำลังโหลด StockFlow…</p>
</body>
</html>
