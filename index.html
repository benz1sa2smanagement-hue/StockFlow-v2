<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1426">
<meta http-equiv="Cache-Control" content="no-cache">
<title>StockFlow v2</title>
<style>
/* Quiet Luxury bootstrap while loading */
html,body{margin:0;height:100%;background:#0B1426;color:#C9A84C;font-family:system-ui,sans-serif}
#boot{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px}
#boot h1{font-weight:600;letter-spacing:3px;margin:0;font-size:22px}
#boot p{opacity:.5;font-size:13px;margin:0}
</style>
</head>
<body>
<div id="boot">
  <h1>STOCKFLOW v2</h1>
  <p>Quiet Luxury · กำลังโหลด…</p>
</div>
<script>
(async function(){
  const ORIGIN = 'https://raw.githubusercontent.com/benz1sa2smanagement-hue/Index.html/main/index.html';
  try {
    const res = await fetch(ORIGIN + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    let html = await res.text();

    const ql = `
:root{
  --bg:#0B1426!important;
  --surface:#12203A!important;
  --surface2:#1A2B4A!important;
  --border:#2A3F5F!important;
  --text:#F5F0E8!important;
  --text2:#A8B0C0!important;
  --text3:#6B7A94!important;
  --accent:#C9A84C!important;
  --accent-light:rgba(201,168,76,0.15)!important;
  --green:#3DDC97!important;
  --green-light:rgba(61,220,151,0.12)!important;
  --red:#E85A5A!important;
  --red-light:rgba(232,90,90,0.12)!important;
  --orange:#E8A04A!important;
  --orange-light:rgba(232,160,74,0.12)!important;
  --purple:#9B7EDE!important;
  --purple-light:rgba(155,126,222,0.15)!important;
}
body{background:var(--bg)!important;color:var(--text)!important;}
.primary-btn{background:linear-gradient(135deg,#D4B55A,#C9A84C)!important;color:#0B1426!important;font-weight:700!important;box-shadow:0 4px 16px rgba(201,168,76,0.25)!important;}
.login-logo,.sval,.aw-val-num{color:#C9A84C!important;}
.nb.active{color:#C9A84C!important;}
.room-chip{background:rgba(201,168,76,0.15)!important;color:#C9A84C!important;border-color:rgba(201,168,76,0.25)!important;}
#nav{background:rgba(11,20,38,0.92)!important;backdrop-filter:blur(16px);border-top:1px solid #2A3F5F!important;}
.card,.card-scroll,.sblock,.sheet,.sh-head{background:#12203A!important;border-color:#2A3F5F!important;}
.aw-hero{background:linear-gradient(145deg,#12203A,#0B1426)!important;border:1px solid rgba(201,168,76,0.25)!important;}
.aw-val-card.awc-cost{background:rgba(232,160,74,0.12)!important;border-color:rgba(232,160,74,0.35)!important;}
.aw-val-card.awc-sale{background:rgba(61,220,151,0.12)!important;border-color:rgba(61,220,151,0.35)!important;}
.aw-val-card.awc-profit{background:rgba(155,126,222,0.12)!important;border-color:rgba(155,126,222,0.35)!important;}
.aw-val-card.awc-sold{background:rgba(201,168,76,0.12)!important;border-color:rgba(201,168,76,0.25)!important;}
.chip.active{background:rgba(201,168,76,0.15)!important;color:#C9A84C!important;border-color:rgba(201,168,76,0.25)!important;}
input,select,textarea{background:#1A2B4A!important;color:#F5F0E8!important;border-color:#2A3F5F!important;}
`;

    html = html.replace(/<title>[^<]*<\/title>/i, '<title>StockFlow v2</title>');
    html = html.replace(/content="#f[0-9a-fA-F]{5}"/i, 'content="#0B1426"');

    if(html.includes('</style>')){
      html = html.replace('</style>', ql + '\n</style>');
    } else {
      html = html.replace('</head>', '<style>'+ql+'</style></head>');
    }

    html = html.replace(/StockFlow(?! v2)/g, 'StockFlow v2');

    html = html.replace(
      /const WH_COLORS=\[[^\]]+\]/,
      "const WH_COLORS=['#C9A84C','#3DDC97','#E8A04A','#9B7EDE','#E85A5A','#5BA3D9']"
    );

    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.getElementById('boot').innerHTML =
      '<h1>STOCKFLOW v2</h1><p style="color:#E85A5A">โหลดไม่สำเร็จ: '+e.message+'</p><p style="opacity:.4;font-size:12px">ตรวจว่า repo Index.html เป็น public</p>';
  }
})();
</script>
</body>
</html>
