<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>StockFlow</title>
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/benz1sa2smanagement-hue/StockFlow-v2@main/';
  var PIN  = 'https://cdn.jsdelivr.net/gh/benz1sa2smanagement-hue/StockFlow-v2@d9733c4f131159c79ebbb5762d63460cacd9711c/index.html';
  var EXTRA = [
    'product-image.js',
    'product-add.js',
    'pack-wrong-guide.js',
    'pack-orders.js',
    'pack-line-ui.js',
    'pack-match.js',
    'pack-sku-expand.js',
    'pack-queue.js',
    'pack-queue-ui.js',
    'pack-bigseller-bridge.js',
    'pack-visual.js'
  ];

  function loadScript(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(true); };
      s.onerror = function () { console.warn('[SF] fail', src); resolve(false); };
      document.head.appendChild(s);
    });
  }

  fetch(PIN, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
    document.open();
    document.write(html);
    document.close();

    setTimeout(function () {
      var chain = Promise.resolve();
      EXTRA.forEach(function (f) {
        chain = chain.then(function () { return loadScript(BASE + f); });
      });
      chain.then(function () {
        console.log('[SF] product-add & pack modules loaded');
        setTimeout(function () {
          if (typeof window.__sfEnsureAddProduct === 'function') window.__sfEnsureAddProduct();
        }, 500);
      });
    }, 100);
  }).catch(function (e) {
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">\u0e42\u0e2b\u0e25\u0e14\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08: ' + e + '</p>';
  });
})();
</script>
</head>
<body>
<p style="padding:24px;font-family:Sarabun,sans-serif;color:#666">\u0e01\u0e33\u0e25\u0e31\u0e07\u0e42\u0e2b\u0e25\u0e14 StockFlow\u2026</p>
</body>
</html>
